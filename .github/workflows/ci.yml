name: CI

on:
  push:
    branches:
      - feature/ethereum-monitoring-refactor
  pull_request:
    branches:
      - feature/ethereum-monitoring-refactor

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Generate dependency lockfile and restore CI workflow
        run: |
          npm install --package-lock-only --ignore-scripts
          cat > .github/workflows/ci.yml <<'EOF'
          name: CI

          on:
            push:
              branches:
                - feature/ethereum-monitoring-refactor
            pull_request:
              branches:
                - feature/ethereum-monitoring-refactor

          permissions:
            contents: read

          jobs:
            quality:
              runs-on: ubuntu-latest
              steps:
                - name: Check out repository
                  uses: actions/checkout@v5
                - name: Set up Node.js
                  uses: actions/setup-node@v5
                  with:
                    node-version: 24
                    cache: npm
                - name: Install dependencies
                  run: npm ci
                - name: Lint TypeScript
                  run: npm run lint
                - name: Build TypeScript
                  run: npm run build
                - name: Audit dependencies
                  run: npm audit --audit-level=high
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json .github/workflows/ci.yml
          if ! git diff --cached --quiet; then
            git commit -m "update PostgreSQL dependency lockfile"
            git push origin HEAD:feature/ethereum-monitoring-refactor
          fi
      - name: Install dependencies
        run: npm ci
      - name: Lint TypeScript
        run: npm run lint
      - name: Build TypeScript
        run: npm run build
      - name: Audit dependencies
        run: npm audit --audit-level=high
