name: CI

on:
  push:
    branches:
      - feature/ethereum-monitoring-refactor
  pull_request:
    branches:
      - feature/ethereum-monitoring-refactor

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Install application dependencies
        run: npm ci
      - name: Install pinned code-quality tools
        run: npm run tools:install
      - name: Apply Prettier formatting
        run: npm run format
      - name: Commit formatting changes
        if: github.event_name == 'push' && github.event.head_commit.message != 'Apply Prettier formatting'
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src package.json tsconfig.json nodemon.json README.md .github/workflows/ci.yml eslint.config.mjs .prettierrc.json
            git commit -m "Apply Prettier formatting"
            git push
          fi
      - name: Lint TypeScript
        run: npm run lint
      - name: Check formatting
        run: npm run format:check
      - name: Build TypeScript
        run: npm run build
      - name: Audit dependencies
        run: npm audit --audit-level=high
